name: Biblioteca gRPC CI

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show Java Version
        run: java -version

      - name: Compile
        run: mvn clean compile

      - name: Package
        run: mvn package
